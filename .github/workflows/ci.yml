name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npx playwright install --with-deps chromium
        if: matrix.node == 24
      - run: npm run test:browser
        if: matrix.node == 24
      - name: Pack npm release candidate
        if: matrix.node == 24
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/atlas-package.json"
      - name: Upload npm archive and integrity manifest
        if: matrix.node == 24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-npm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/angularkit-atlas-*.tgz
            ${{ runner.temp }}/atlas-package.json
          if-no-files-found: error
          retention-days: 14
