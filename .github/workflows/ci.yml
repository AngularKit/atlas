name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run quality
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Pack npm release candidate
        if: matrix.node == 24
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/atlas-package.json"
      - name: Upload npm archive and integrity manifest
        if: matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: atlas-npm-${{ github.sha }}
          path: |
            ${{ runner.temp }}/angularkit-atlas-*.tgz
            ${{ runner.temp }}/atlas-package.json
          if-no-files-found: error
          retention-days: 14
