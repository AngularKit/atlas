name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    name: Check release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require a stable version merged into main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"

  quality:
    needs: release
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Use an npm version supporting trusted publishing
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-npm-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Check and unpack the tested archive
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: node scripts/prepare-release.mjs "$RELEASE_DIR"
      # Publish from the extracted directory so npm also receives the README
      # metadata. No rebuild or lifecycle script may change the tested files.
      - name: Verify that repacking preserves the tested archive
        working-directory: ${{ runner.temp }}/release/package
        run: |
          npm pack --ignore-scripts --pack-destination .. --json > ../repacked.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import fs from "node:fs";
            const [original] = JSON.parse(fs.readFileSync("../atlas-package.json"));
            const [repacked] = JSON.parse(fs.readFileSync("../repacked.json"));
            assert.equal(repacked.integrity, original.integrity, "Release archive changed after validation");
          '
      - name: Publish with npm trusted publishing and provenance
        working-directory: ${{ runner.temp }}/release/package
        run: npm publish --ignore-scripts --access public --provenance
      - name: Verify the public installation
        env:
          RELEASE_DIR: ${{ runner.temp }}/release
        run: node scripts/verify-release.mjs "$RELEASE_DIR/atlas-package.json"
