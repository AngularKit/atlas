name: Publish npm

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: .github/release/pnpm-lock.yaml
      - name: Use an npm version supporting trusted publishing
        run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: atlas-npm-${{ github.sha }}
          path: ${{ runner.temp }}/release
      - name: Install isolated release tooling
        run: pnpm --dir .github/release install --frozen-lockfile --ignore-scripts
      - name: Version, publish and verify the tested package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DIR: ${{ runner.temp }}/release
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: node .github/release/run.mjs "$RELEASE_DIR"
      - name: Retain prepared release for diagnosis and registry verification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-published-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/published-package.json
            ${{ runner.temp }}/release/published/*.tgz
          if-no-files-found: ignore
          retention-days: 14
